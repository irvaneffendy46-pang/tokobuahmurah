<script>
/* ============================================================
   buahmurah.id — ERP (Kasir & Manajemen)
   Backend: Supabase (Postgres + Storage + Realtime)
   ============================================================ */

/* >>> ISI DENGAN KREDENSIAL PROJECT SUPABASE ANDA <<< */
const SUPABASE_URL = 'https://kbvyzvcrxtyogldhycba.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_p8JjGy_f8JEn4zA9n2_HDQ_8vSQm134';
const PHOTO_BUCKET = 'bukti-pembayaran';
/* ---------------------------------------------------- */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ACCOUNTS = {
  kasir: { id: 'kasir1', password: 'kasir123', role: 'kasir', label: 'Kasir', loginType: 'id' },
  manajemen: { email: 'irvan.effendy46@gmail.com', password: 'manajemen123', role: 'manajemen', label: 'Manajemen', loginType: 'email' }
};

let SESSION = null; // {role,label,identifier}  (in-memory only, hilang saat refresh)

let DB = {
  fruits: [],      // {id,name,stock,unit}
  sales: [],        // {id,date,items:[{fruitId,name,qty}],payment,total,photo,createdAt}
  expenses: [],      // {id,date,desc,amount,photo,createdAt}
  kulakan: [],       // {id,date,desc,items:[{fruitId,name,qty}],amount,photo,createdAt}
  gaji: [],           // {id,month,employee,totalDays,presentDays,basicSalary,kasbon,total}
  stockopname: [],     // {id,date,desc,fruitId,fruitName,qty,condition}
  manualCash: []        // {id,date,desc,debit,kredit,photo}
};

/* Peta nama tabel Supabase <-> key DB lokal, plus mapper kolom snake_case -> camelCase */
const TABLES = {
  fruits:      { table:'fruits',      map:r=>({ id:r.id, name:r.name, stock:Number(r.stock), unit:r.unit }) },
  sales:       { table:'sales',       map:r=>({ id:r.id, date:r.date, items:r.items, payment:r.payment, total:Number(r.total), photo:r.photo_url, createdAt:r.created_at }) },
  expenses:    { table:'expenses',    map:r=>({ id:r.id, date:r.date, desc:r.description, amount:Number(r.amount), photo:r.photo_url, createdAt:r.created_at }) },
  kulakan:     { table:'kulakan',     map:r=>({ id:r.id, date:r.date, desc:r.description, items:r.items, amount:Number(r.amount), photo:r.photo_url, createdAt:r.created_at }) },
  gaji:        { table:'gaji',        map:r=>({ id:r.id, month:r.month, employee:r.employee, totalDays:Number(r.total_days), presentDays:Number(r.present_days), basicSalary:Number(r.basic_salary), kasbon:Number(r.kasbon), total:Number(r.total) }) },
  stockopname: { table:'stockopname', map:r=>({ id:r.id, date:r.date, desc:r.description, fruitId:r.fruit_id, fruitName:r.fruit_name, qty:Number(r.qty), condition:r.condition }) },
  manualCash:  { table:'manual_cash', map:r=>({ id:r.id, date:r.date, desc:r.description, debit:Number(r.debit), kredit:Number(r.kredit), photo:r.photo_url, createdAt:r.created_at }) }
};

let LOADED = false;
let currentView = 'penjualan';
let toastTimer = null;

/* ---------------- Supabase helpers ---------------- */
async function reloadTable(key){
  const cfg = TABLES[key];
  const { data, error } = await sb.from(cfg.table).select('*').order('created_at', { ascending:true });
  if(error){ showToast('Gagal memuat data dari Supabase ('+key+').'); return; }
  DB[key] = (data||[]).map(cfg.map);
}
async function loadAll(){
  for(const key of Object.keys(TABLES)) await reloadTable(key);
  if(DB.fruits.length === 0){
    const seed = [
      {id:'F1', name:'Apel Fuji', stock:50, unit:'kg'},
      {id:'F2', name:'Jeruk Medan', stock:80, unit:'kg'},
      {id:'F3', name:'Pisang Cavendish', stock:40, unit:'kg'},
      {id:'F4', name:'Semangka', stock:30, unit:'kg'},
      {id:'F5', name:'Anggur Import', stock:20, unit:'kg'}
    ];
    const { error } = await sb.from('fruits').insert(seed);
    if(error){ showToast('Gagal membuat data awal buah. Cek koneksi Supabase.'); }
    await reloadTable('fruits');
  }
  LOADED = true;
}
async function insertRow(key, obj){
  const { error } = await sb.from(TABLES[key].table).insert(obj);
  if(error){ showToast('Gagal menyimpan: '+error.message); return false; }
  return true;
}
async function updateFruitStock(fruitId, newStock){
  const { error } = await sb.from('fruits').update({ stock:newStock }).eq('id', fruitId);
  if(error){ showToast('Gagal memperbarui stok.'); return false; }
  return true;
}
async function deleteRow(key, id){
  const { error } = await sb.from(TABLES[key].table).delete().eq('id', id);
  if(error){ showToast('Gagal menghapus data.'); return false; }
  return true;
}
function subscribeRealtime(){
  Object.entries(TABLES).forEach(([key, cfg])=>{
    sb.channel('rt_'+cfg.table)
      .on('postgres_changes', { event:'*', schema:'public', table:cfg.table }, async ()=>{
        await reloadTable(key);
        if(SESSION && document.getElementById('content')) renderView();
      })
      .subscribe();
  });
}
function nextId(prefix, arr){
  const n = arr.length + 1;
  return prefix + '-' + String(n).padStart(4,'0');
}
function fmtRp(n){
  n = Number(n)||0;
  return 'Rp' + n.toLocaleString('id-ID');
}
function fmtDate(d){
  if(!d) return '-';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
}
function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function showToast(msg){
  const el = document.getElementById('toast');
  if(!el){ console.warn(msg); return; }
  el.textContent = msg;
  el.style.display = 'flex';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display='none'; }, 2600);
}

/* compress uploaded photo, lalu unggah ke Supabase Storage dan kembalikan URL publik */
function fileToCompressedBase64(file){
  return new Promise((resolve,reject)=>{
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 720;
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.62));
      };
      img.onerror = ()=> resolve(null);
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(reader.error);
    reader.readAsDataURL(file);
  });
}
async function uploadPhoto(dataUrl, folder){
  if(!dataUrl) return null;
  try{
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const filename = folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.jpg';
    const { error } = await sb.storage.from(PHOTO_BUCKET).upload(filename, blob, { contentType:'image/jpeg' });
    if(error){ showToast('Gagal unggah foto ke Supabase Storage.'); return null; }
    const { data } = sb.storage.from(PHOTO_BUCKET).getPublicUrl(filename);
    return data.publicUrl;
  }catch(e){ showToast('Gagal unggah foto.'); return null; }
}

/* ---------------- cashflow aggregation ---------------- */
function buildCashflow(){
  const rows = [];
  DB.sales.forEach(s=> rows.push({
    date:s.date, desc:'Penjualan buah ('+s.items.map(i=>i.name+' '+i.qty+'kg').join(', ')+')'+(s.payment?' — '+s.payment:''),
    debit:0, kredit:Number(s.total)||0, photo:s.photo, sort:s.createdAt||s.date, source:'Kasir'
  }));
  DB.expenses.forEach(e=> rows.push({
    date:e.date, desc:'Pengeluaran: '+e.desc, debit:Number(e.amount)||0, kredit:0, photo:e.photo, sort:e.createdAt||e.date, source:'Kasir'
  }));
  DB.kulakan.forEach(k=> rows.push({
    date:k.date, desc:'Kulakan: '+(k.desc || k.items.map(i=>i.name+' '+i.qty+'kg').join(', ')),
    debit:Number(k.amount)||0, kredit:0, photo:k.photo, sort:k.createdAt||k.date, source:'Manajemen'
  }));
  DB.manualCash.forEach(m=> rows.push({
    date:m.date, desc:m.desc, debit:Number(m.debit)||0, kredit:Number(m.kredit)||0, photo:m.photo, sort:m.createdAt||m.date, source:'Manual'
  }));
  rows.sort((a,b)=> (a.sort||'').localeCompare(b.sort||''));
  let saldo = 0;
  rows.forEach((r,i)=>{
    saldo += r.kredit - r.debit;
    r.saldo = saldo;
    r.no = i+1;
  });
  return rows;
}

  document.querySelectorAll('[data-check]').forEach(chk=>{

      const fid = chk.dataset.check;

  document.querySelectorAll('[data-pay]').forEach(b=>{

    drop.textContent = 'Foto terpasang: '+f.name;

    prev.src = salePhoto; prev.style.display='block';

    const date = document.getElementById('saleDate').value || todayStr();
    const total = Number(document.getElementById('saleTotal').value);
    const items = Object.keys(saleSelected).map(fid=>{
      const f = DB.fruits.find(x=>x.id===fid);
      return { fruitId:fid, name:f?f.name:fid, qty:Number(saleSelected[fid]) };
    }).filter(i=>i.qty>0);

    if(items.length===0){ showToast('Pilih minimal satu buah dan isi jumlahnya.'); return; }
    if(!total || total<=0){ showToast('Isi total penjualan (Rp).'); return; }

    for(const it of items){
      const f = DB.fruits.find(x=>x.id===it.fruitId);
      if(f && it.qty > f.stock){ showToast(`Stok ${f.name} tidak cukup (sisa ${f.stock}kg).`); return; }

    btn.disabled = true; btn.textContent = 'Menyimpan...';

    const ok = await insertRow('sales', {
      id: nextId('PJ', DB.sales), date, items, payment: salePayment, total, photo_url: photoUrl
    });
    if(ok){
      for(const it of items){
        const f = DB.fruits.find(x=>x.id===it.fruitId);
        if(f) await updateFruitStock(f.id, Math.max(0, +(f.stock - it.qty).toFixed(2)));
      }
      await reloadTable('fruits');
      await reloadTable('sales');
      saleSelected = {}; salePayment = 'Cash'; salePhoto = null;
      showToast('Transaksi penjualan tersimpan.');
    }
    renderPenjualan(c);
  };
}

  c.innerHTML = `

        <td>${r.no}</td><td>${fmtDate(r.date)}</td><td>${r.desc}</td>

        <td class="mono">${r.kredit?fmtRp(r.kredit):'-'}</td>
        <td class="mono"><b>${fmtRp(r.saldo)}</b></td>
        <td>${r.photo?`<img class="thumb" src="${r.photo}" data-photo="${r.photo}">`:'<span class="muted">-</span>'}</td>

  bg.innerHTML = `

  document.getElementById('mcSave').onclick = async ()=>{

      <tr><th>Jenis buah</th><th>Jumlah</th><th>Satuan</th><th></th></tr>
      ${DB.fruits.map(f=>`<tr>
        <td>${f.name}</td>
        <td class="mono">${f.stock <= 5 ? `<span class="tag tag-bad">${f.stock}</span>` : f.stock}</td>
        <td>${f.unit}</td>
        <td><button class="btn btn-danger" data-del="${f.id}" style="padding:6px 10px;font-size:12px;">Hapus</button></td>
      </tr>`).join('')}
    </table></div>`}
  </div>`;

  document.getElementById('jbAdd').onclick = async ()=>{
    const name = document.getElementById('jbName').value.trim();
    const stock = Number(document.getElementById('jbStock').value)||0;
    const unit = document.getElementById('jbUnit').value.trim() || 'kg';
    if(!name){ showToast('Isi nama buah.'); return; }
    const ok = await insertRow('fruits', { id:'F'+Date.now(), name, stock, unit });
    if(ok){ await reloadTable('fruits'); showToast('Jenis buah ditambahkan.'); }
    renderJenisBuah(c);
  };
  document.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Hapus jenis buah ini?')) return;
      const ok = await deleteRow('fruits', b.dataset.del);
      if(ok) await reloadTable('fruits');
      renderJenisBuah(c);
    };
  });
}

/* ============================================================
   MANAJEMEN — KULAKAN
   ============================================================ */
let kulakanSelected = {};
let kulakanPhoto = null;
function renderKulakan(c){
  const fruits = DB.fruits;
  const recent = [...DB.kulakan].sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,8);
  c.innerHTML = `
  <div class="card">
    <div class="card-head"><h2>Kulakan (belanja stok)</h2></div>
    <div class="field"><label>Tanggal</label><input type="date" id="kkDate" value="${todayStr()}"></div>
    <div class="field">
      <label>Buah yang dibeli</label>
      <div class="fruit-picker">
        ${fruits.map(f=>`
          <div class="fruit-opt ${kulakanSelected[f.id]!==undefined?'checked':''}">
            <div class="fo-top"><input type="checkbox" data-kcheck="${f.id}" ${kulakanSelected[f.id]!==undefined?'checked':''}><span>${f.name}</span></div>
            <div class="fo-qty" style="${kulakanSelected[f.id]!==undefined?'':'display:none'}">
              <input type="number" min="0.1" step="0.1" placeholder="Jumlah" data-kqty="${f.id}" value="${kulakanSelected[f.id]||''}"><span class="muted">kg</span>
            </div>
            <div class="fo-stock">Stok saat ini: ${f.stock} ${f.unit}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="form-grid">
      <div class="field"><label>Keterangan (opsional)</label><input type="text" id="kkDesc" placeholder="cth. Beli dari Pasar Induk"></div>
      <div class="field"><label>Nominal (Rp)</label><input type="number" min="0" id="kkAmount" placeholder="cth. 500000"></div>
    </div>
    <div class="field">
      <label>Foto bukti pembayaran</label>
      <div class="file-drop" id="kkDrop">Ketuk untuk unggah foto</div>
      <input type="file" accept="image/*" id="kkFile" style="display:none">
      <img id="kkPreview" class="preview-img" style="display:none">
    </div>
    <button class="btn btn-primary" id="kkSubmit" style="margin-top:6px;">Submit / OK</button>
  </div>
  <div class="card">
    <h2>Riwayat kulakan</h2>
    ${recent.length===0 ? emptyState('Belum ada transaksi kulakan.') : `
    <div class="table-wrap"><table>
      <tr><th>Tanggal</th><th>Buah</th><th>Nominal</th><th>Bukti</th></tr>
      ${recent.map(k=>`<tr>
        <td>${fmtDate(k.date)}</td><td>${k.items.map(i=>i.name+' ('+i.qty+'kg)').join(', ')}</td>
        <td class="mono">${fmtRp(k.amount)}</td>
        <td>${k.photo?`<img class="thumb" src="${k.photo}" data-photo="${k.photo}">`:'<span class="muted">-</span>'}</td>
      </tr>`).join('')}
    </table></div>`}
  </div>`;

  document.querySelectorAll('[data-kcheck]').forEach(chk=>{
    chk.onchange = ()=>{
      const fid = chk.dataset.kcheck;
      if(chk.checked){ kulakanSelected[fid] = kulakanSelected[fid]||''; } else { delete kulakanSelected[fid]; }
      renderKulakan(c);
    };
  });
  document.querySelectorAll('[data-kqty]').forEach(inp=>{ inp.oninput = ()=>{ kulakanSelected[inp.dataset.kqty] = inp.value; }; });

  const drop = document.getElementById('kkDrop');
  const fileInput = document.getElementById('kkFile');
  drop.onclick = ()=> fileInput.click();
  fileInput.onchange = async ()=>{
    const f = fileInput.files[0]; if(!f) return;
    drop.textContent = 'Memproses foto...';
    kulakanPhoto = await fileToCompressedBase64(f);
    drop.textContent = 'Foto terpasang: '+f.name; drop.classList.add('has-file');
    const prev = document.getElementById('kkPreview'); prev.src = kulakanPhoto; prev.style.display='block';
  };
  attachThumbClicks(c);

  document.getElementById('kkSubmit').onclick = async ()=>{
    const date = document.getElementById('kkDate').value || todayStr();
    const desc = document.getElementById('kkDesc').value.trim();
    const amount = Number(document.getElementById('kkAmount').value);
    const items = Object.keys(kulakanSelected).map(fid=>{
      const f = DB.fruits.find(x=>x.id===fid);
      return { fruitId:fid, name:f?f.name:fid, qty:Number(kulakanSelected[fid]) };
    }).filter(i=>i.qty>0);
    if(items.length===0){ showToast('Pilih minimal satu buah dan isi jumlahnya.'); return; }
    if(!amount || amount<=0){ showToast('Isi nominal kulakan.'); return; }

    const btn = document.getElementById('kkSubmit');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    const photoUrl = await uploadPhoto(kulakanPhoto, 'kulakan');

    const ok = await insertRow('kulakan', { id: nextId('KL', DB.kulakan), date, description: desc, items, amount, photo_url: photoUrl });
    if(ok){
      for(const it of items){
        const f = DB.fruits.find(x=>x.id===it.fruitId);
        if(f) await updateFruitStock(f.id, +(f.stock + it.qty).toFixed(2));
      }
      await reloadTable('fruits');
      await reloadTable('kulakan');
      kulakanSelected = {}; kulakanPhoto = null;
      showToast('Kulakan tersimpan, stok diperbarui.');
    }
    renderKulakan(c);
  };
}

/* ============================================================
   MANAJEMEN — GAJI
   ============================================================ */
function renderGaji(c){
  const recent = [...DB.gaji].sort((a,b)=> (b.id||'').localeCompare(a.id||''));
  c.innerHTML = `
  <div class="card">
    <div class="card-head"><h2>Input gaji</h2></div>
    <div class="form-grid">
      <div class="field"><label>Bulan</label><input type="month" id="gjMonth" value="${todayStr().slice(0,7)}"></div>
      <div class="field"><label>Nama karyawan</label><input type="text" id="gjEmployee" placeholder="cth. Budi"></div>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;">
      <div class="field"><label>Total hari kerja</label><input type="number" min="0" id="gjTotalDays" placeholder="cth. 26"></div>
      <div class="field"><label>Absensi (hari hadir)</label><input type="number" min="0" id="gjPresent" placeholder="cth. 24"></div>
      <div class="field"><label>Gaji pokok (Rp)</label><input type="number" min="0" id="gjBasic" placeholder="cth. 2500000"></div>
    </div>
    <div class="field"><label>Kasbon (Rp)</label><input type="number" min="0" id="gjKasbon" placeholder="0"></div>
    <button class="btn btn-primary" id="gjSubmit">Simpan</button>
  </div>
  <div class="card">
    <h2>Rekap gaji</h2>
    ${recent.length===0 ? emptyState('Belum ada data gaji.') : `
    <div class="table-wrap"><table>
      <tr><th>No</th><th>Bulan</th><th>Karyawan</th><th>Absensi</th><th>Kasbon</th><th>Total</th></tr>
      ${recent.map(g=>`<tr>
        <td>${g.id}</td><td>${g.month}</td><td>${g.employee}</td>
        <td>${g.presentDays}/${g.totalDays} hari</td>
        <td class="mono">${fmtRp(g.kasbon)}</td>
        <td class="mono"><b>${fmtRp(g.total)}</b></td>
      </tr>`).join('')}
    </table></div>`}
  </div>`;

  document.getElementById('gjSubmit').onclick = async ()=>{
    const month = document.getElementById('gjMonth').value;
    const employee = document.getElementById('gjEmployee').value.trim();
    const totalDays = Number(document.getElementById('gjTotalDays').value);
    const presentDays = Number(document.getElementById('gjPresent').value);
    const basicSalary = Number(document.getElementById('gjBasic').value);
    const kasbon = Number(document.getElementById('gjKasbon').value)||0;
    if(!employee){ showToast('Isi nama karyawan.'); return; }
    if(!month){ showToast('Pilih bulan.'); return; }
    if(!totalDays || !basicSalary){ showToast('Isi total hari kerja dan gaji pokok.'); return; }
    const prorata = presentDays>=totalDays ? basicSalary : Math.round(basicSalary * (presentDays/totalDays));
    const total = Math.max(0, prorata - kasbon);
    const ok = await insertRow('gaji', {
      id: nextId('GJ', DB.gaji), month, employee, total_days: totalDays, present_days: presentDays,
      basic_salary: basicSalary, kasbon, total
    });
    if(ok){ await reloadTable('gaji'); showToast('Data gaji tersimpan.'); }
    renderGaji(c);
  };
}

/* ============================================================
   MANAJEMEN — STOCK OPNAME
   ============================================================ */
function renderStockOpname(c){
  const fruits = DB.fruits;
  const recent = [...DB.stockopname].sort((a,b)=> (b.id||'').localeCompare(a.id||''));
  c.innerHTML = `
  <div class="card">
    <div class="card-head"><h2>Catat stock opname</h2></div>
    <div class="form-grid">
      <div class="field"><label>Tanggal</label><input type="date" id="soDate" value="${todayStr()}"></div>
      <div class="field"><label>Buah diperiksa</label>
        <select id="soFruit">${fruits.map(f=>`<option value="${f.id}">${f.name} (stok: ${f.stock}${f.unit})</option>`).join('')}</select>
      </div>
    </div>
    <div class="form-grid">
      <div class="field"><label>Jumlah diperiksa</label><input type="number" min="0" step="0.1" id="soQty" placeholder="cth. 5"></div>
      <div class="field"><label>Kondisi</label>
        <div class="pay-toggle">
          <button type="button" class="pay-opt checked" data-cond="Baik">Baik</button>
          <button type="button" class="pay-opt" data-cond="Rusak">Rusak</button>
        </div>
      </div>
    </div>
    <div class="field"><label>Keterangan</label><input type="text" id="soDesc" placeholder="cth. Beberapa buah mulai busuk di bagian bawah"></div>
    <button class="btn btn-primary" id="soSubmit">Submit / OK</button>
    <div class="muted" style="font-size:12px;margin-top:8px;">Jika kondisi "Rusak" dipilih, jumlah tersebut otomatis dikurangi dari stok buah.</div>
  </div>
  <div class="card">
    <h2>Riwayat stock opname</h2>
    ${recent.length===0 ? emptyState('Belum ada catatan stock opname.') : `
    <div class="table-wrap"><table>
      <tr><th>No</th><th>Tanggal</th><th>Keterangan</th><th>Buah</th><th>Jumlah</th><th>Kondisi</th></tr>
      ${recent.map(s=>`<tr>
        <td>${s.id}</td><td>${fmtDate(s.date)}</td><td>${s.desc||'-'}</td><td>${s.fruitName}</td><td>${s.qty}</td>
        <td><span class="tag ${s.condition==='Baik'?'tag-good':'tag-bad'}">${s.condition}</span></td>
      </tr>`).join('')}
    </table></div>`}
  </div>`;

  let soCondition = 'Baik';
  document.querySelectorAll('[data-cond]').forEach(b=>{
    b.onclick = ()=>{
      soCondition = b.dataset.cond;
      document.querySelectorAll('[data-cond]').forEach(x=>x.classList.remove('checked'));
      b.classList.add('checked');
    };
  });

  document.getElementById('soSubmit').onclick = async ()=>{
    const date = document.getElementById('soDate').value || todayStr();
    const fruitId = document.getElementById('soFruit').value;
    const qty = Number(document.getElementById('soQty').value);
    const desc = document.getElementById('soDesc').value.trim();
    const f = DB.fruits.find(x=>x.id===fruitId);
    if(!qty || qty<=0){ showToast('Isi jumlah yang diperiksa.'); return; }
    const ok = await insertRow('stockopname', {
      id: nextId('SO', DB.stockopname), date, description: desc, fruit_id: fruitId,
      fruit_name: f?f.name:fruitId, qty, condition: soCondition
    });
    if(ok){
      if(soCondition==='Rusak' && f){
        await updateFruitStock(f.id, Math.max(0, +(f.stock - qty).toFixed(2)));
        await reloadTable('fruits');
      }
      await reloadTable('stockopname');
      showToast('Stock opname tersimpan.');
    }
    renderStockOpname(c);
  };
}

/* ============================================================
   Shared helpers
   ============================================================ */
function emptyState(msg){
  return `<div class="empty-state"><div class="em-ic">🍊</div>${msg}</div>`;
}
function attachThumbClicks(c){
  c.querySelectorAll('[data-photo]').forEach(img=>{
    img.onclick = ()=>{
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `<div class="modal"><button class="close-x" id="pmClose">&times;</button><img src="${img.dataset.photo}"></div>`;
      document.body.appendChild(bg);
      document.getElementById('pmClose').onclick = ()=> bg.remove();
      bg.onclick = (e)=>{ if(e.target===bg) bg.remove(); };
    };
  });
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;">Menghubungkan ke Supabase...</div>`;
  await loadAll();
  subscribeRealtime();
  renderLogin();
}
init();
</script>
