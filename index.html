<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>buahmurah.id</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --biru-tua:#0A3D91; --biru:#1157C7;
  --biru-kabut:#E7F0FF; --kuning:#FFC91D; --kuning-tua:#E5A800;
  --tinta:#0E1B33; --teks-lembut:#5F708C;
  --garis:#DCE5F2; --bg:#F4F7FC; --putih:#fff;
  --merah:#C62F3B; --hijau:#137A4E;
  --r:14px; --r-kecil:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--tinta); line-height:1.5;
  font-size:15px; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--biru)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--kuning);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ MEREK ============ */
.merek{font-weight:800;letter-spacing:-.03em;line-height:1}
.merek .id{color:var(--kuning)}

/* ============ LOGIN ============ */
#login{min-height:100dvh;display:grid;grid-template-columns:1.05fr .95fr}
.login-kiri{
  background:var(--biru-tua);
  background-image:
    radial-gradient(circle at 18% 22%, rgba(255,201,29,.22) 0 22%, transparent 22.5%),
    radial-gradient(circle at 72% 68%, rgba(46,123,239,.55) 0 26%, transparent 26.5%),
    radial-gradient(circle at 40% 88%, rgba(255,201,29,.12) 0 18%, transparent 18.5%);
  color:#fff;padding:56px 52px;display:flex;flex-direction:column;justify-content:space-between;
}
.login-kiri .merek{font-size:clamp(38px,4.6vw,60px)}
.login-kiri p{max-width:34ch;color:#C6D8F5;margin-top:18px;font-size:17px}
.keranjang{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:40px}
.keranjang span{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  padding:7px 14px;border-radius:100px;font-size:13px;font-weight:600;color:#DCE8FB
}
.login-kanan{display:flex;align-items:center;justify-content:center;padding:40px 32px;background:var(--putih)}
.kotak-login{width:100%;max-width:370px}
.kotak-login h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.kotak-login .sub{color:var(--teks-lembut);margin:6px 0 30px}
label{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px}
.isian{
  width:100%;padding:13px 15px;border:1.5px solid var(--garis);border-radius:var(--r-kecil);
  background:var(--putih);transition:border-color .15s
}
.isian:focus{border-color:var(--biru);outline:none;box-shadow:0 0 0 3px var(--biru-kabut)}
.grup{margin-bottom:18px}
.tombol-utama{
  width:100%;background:var(--biru);color:#fff;font-weight:700;padding:14px;
  border-radius:var(--r-kecil);transition:background .15s
}
.tombol-utama:hover{background:var(--biru-tua)}
.tombol-utama:disabled{opacity:.55;cursor:not-allowed}
.pesan{padding:12px 14px;border-radius:var(--r-kecil);font-size:14px;margin-bottom:18px;display:none}
.pesan.tampil{display:block}
.pesan.salah{background:#FDECEE;color:var(--merah);border:1px solid #F5C6CB}
.pesan.info{background:var(--biru-kabut);color:var(--biru-tua);border:1px solid #C5DAFB}
@media(max-width:860px){
  #login{grid-template-columns:1fr}
  .login-kiri{padding:38px 26px 32px}
  .login-kiri p{font-size:15px}
  .keranjang{padding-top:26px}
  .login-kanan{padding:32px 24px 60px}
}

/* ============ RANGKA APLIKASI ============ */
#app{display:none;min-height:100dvh;grid-template-columns:236px 1fr}
#app.tampil{display:grid}
.sisi{background:var(--biru-tua);color:#fff;padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100dvh}
.sisi .merek{font-size:22px;padding:0 10px 22px}
.menu{display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.menu button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:11px 12px;border-radius:10px;color:#B9CFF0;font-weight:600;font-size:14.5px;transition:.15s
}
.menu button:hover{background:rgba(255,255,255,.08);color:#fff}
.menu button.aktif{background:var(--kuning);color:var(--biru-tua);font-weight:700}
.menu .ikon{width:19px;text-align:center;font-size:15px}
.menu .pisah{color:#7E9AC6;font-size:11.5px;font-weight:700;padding:16px 12px 7px;letter-spacing:.04em}
.kartu-user{margin-top:auto;padding:13px 12px;background:rgba(255,255,255,.07);border-radius:11px}
.kartu-user .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kartu-user .rl{font-size:12px;color:var(--kuning);font-weight:600;margin-top:1px}
.kartu-user button{margin-top:10px;width:100%;padding:8px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:600}
.kartu-user button:hover{background:rgba(255,255,255,.22)}

main{padding:30px 34px 90px;min-width:0}
.judul{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.judul h2{font-size:25px;font-weight:800;letter-spacing:-.02em}
.judul p{color:var(--teks-lembut);font-size:14.5px;margin-top:3px}

.papan{background:var(--putih);border:1px solid var(--garis);border-radius:var(--r)}
.papan-isi{padding:22px}

.tombol{padding:11px 18px;border-radius:var(--r-kecil);font-weight:700;font-size:14.5px;transition:.15s}
.tombol.kuning{background:var(--kuning);color:var(--biru-tua)}
.tombol.kuning:hover{background:var(--kuning-tua)}
.tombol.biru{background:var(--biru);color:#fff}
.tombol.biru:hover{background:var(--biru-tua)}
.tombol.garis{border:1.5px solid var(--garis);background:#fff}
.tombol.garis:hover{border-color:var(--biru);color:var(--biru)}
.tombol:disabled{opacity:.5;cursor:not-allowed}

/* ============ KASIR ============ */
.kasir{display:grid;grid-template-columns:1fr 330px;gap:22px;align-items:start}
.baris2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pilih-bayar{display:flex;gap:10px}
.pilih-bayar button{
  flex:1;padding:13px;border:1.5px solid var(--garis);border-radius:var(--r-kecil);
  font-weight:600;background:#fff;transition:.15s
}
.pilih-bayar button.aktif{border-color:var(--biru);background:var(--biru-kabut);color:var(--biru-tua)}
.stepper{display:flex;align-items:center;gap:0}
.stepper button{
  width:48px;height:48px;border:1.5px solid var(--garis);background:#fff;font-size:20px;font-weight:700;color:var(--biru)
}
.stepper button:first-child{border-radius:var(--r-kecil) 0 0 var(--r-kecil)}
.stepper button:last-child{border-radius:0 var(--r-kecil) var(--r-kecil) 0}
.stepper input{
  flex:1;height:48px;text-align:center;border:1.5px solid var(--garis);border-left:none;border-right:none;
  font-weight:700;font-size:17px;min-width:0
}
.satuan-tag{
  display:inline-flex;align-items:center;padding:0 12px;height:48px;background:var(--biru-kabut);
  color:var(--biru-tua);font-weight:700;border-radius:0 var(--r-kecil) var(--r-kecil) 0;border:1.5px solid var(--garis);border-left:none
}
.dengan-satuan{display:flex}
.dengan-satuan .isian{border-radius:var(--r-kecil) 0 0 var(--r-kecil);height:48px}
.total-bar{
  background:var(--kuning);border-radius:var(--r);padding:20px 22px;margin:4px 0 20px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap
}
.total-bar .lb{font-weight:700;color:var(--biru-tua);font-size:15px}
.total-bar .ag{font-size:31px;font-weight:800;color:var(--biru-tua);letter-spacing:-.02em}
.ringkas{display:flex;flex-direction:column;gap:14px}
.stat{background:var(--putih);border:1px solid var(--garis);border-radius:var(--r);padding:18px 20px}
.stat .lb{font-size:13.5px;color:var(--teks-lembut);font-weight:600}
.stat .ag{font-size:26px;font-weight:800;margin-top:5px;letter-spacing:-.02em}
.stat.tegas{background:var(--biru-tua);border-color:var(--biru-tua)}
.stat.tegas .lb{color:#A9C5EC}
.stat.tegas .ag{color:var(--kuning)}

/* ============ TABEL ============ */
.gulung{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  text-align:left;font-weight:700;font-size:12.5px;color:var(--biru-tua);
  background:var(--biru-kabut);padding:11px 13px;white-space:nowrap;border-bottom:1px solid var(--garis)
}
td{padding:11px 13px;border-bottom:1px solid #EDF2F9;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
.kanan{text-align:right}
td.kanan,th.kanan{font-variant-numeric:tabular-nums}
.saldo-sel{font-weight:700;background:#FFFBEB}
.kosong{padding:44px 20px;text-align:center;color:var(--teks-lembut)}
.kosong strong{display:block;color:var(--tinta);font-size:16px;margin-bottom:4px}
.lencana{display:inline-block;padding:3px 9px;border-radius:100px;font-size:12px;font-weight:700}
.lencana.baik{background:#E3F5EC;color:var(--hijau)}
.lencana.rusak{background:#FDECEE;color:var(--merah)}
.lencana.cash{background:#FFF6D9;color:#8A6300}
.lencana.tf{background:var(--biru-kabut);color:var(--biru-tua)}
.hapus{color:var(--merah);font-weight:600;font-size:13px}
.form-tambah{background:#F8FBFF;border-bottom:1px solid var(--garis);padding:18px 22px;display:none}
.form-tambah.buka{display:block}
.kisi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.kepala-papan{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;border-bottom:1px solid var(--garis)}
.kepala-papan h3{font-size:16px;font-weight:700}
.kepala-papan .ket{font-size:13px;color:var(--teks-lembut)}

/* Nav bawah untuk layar kecil */
.nav-bawah{display:none}
@media(max-width:960px){
  #app.tampil{grid-template-columns:1fr}
  .sisi{display:none}
  main{padding:20px 16px 96px}
  .kasir{grid-template-columns:1fr}
  .judul h2{font-size:22px}
  .nav-bawah{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--biru-tua);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));gap:2px;overflow-x:auto
  }
  .nav-bawah button{
    flex:1 0 auto;min-width:72px;padding:8px 6px;border-radius:9px;color:#B9CFF0;
    font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px
  }
  .nav-bawah button .ikon{font-size:17px}
  .nav-bawah button.aktif{background:var(--kuning);color:var(--biru-tua)}
  .puncak{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--biru-tua);color:#fff;margin:-20px -16px 20px;padding:14px 16px
  }
  .puncak .merek{font-size:18px}
  .puncak button{color:var(--kuning);font-weight:700;font-size:13px}
  .baris2{grid-template-columns:1fr}
}
@media(min-width:961px){.puncak{display:none}}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:var(--tinta);color:#fff;padding:13px 20px;border-radius:100px;font-weight:600;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center
}
#toast.tampil{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.sukses{background:var(--hijau)}
#toast.gagal{background:var(--merah)}
.memuat{padding:40px;text-align:center;color:var(--teks-lembut)}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="login-kiri">
    <div>
      <div class="merek">buahmurah<span class="id">.id</span></div>
      <p>Catat penjualan di depan, rapikan pembukuan di belakang. Satu tempat untuk kasir dan pemilik.</p>
    </div>
    <div class="keranjang">
      <span>Penjualan harian</span><span>Pengeluaran</span><span>Cashflow</span>
      <span>Kulakan</span><span>Gaji</span><span>Stok buah</span>
    </div>
  </div>
  <div class="login-kanan">
    <div class="kotak-login">
      <h1>Masuk</h1>
      <p class="sub">Gunakan email dan kata sandi yang diberikan pemilik toko.</p>
      <div class="pesan" id="pesanLogin"></div>
      <div class="grup">
        <label for="email">Email</label>
        <input id="email" class="isian" type="email" autocomplete="username" placeholder="kasir@buahmurah.id">
      </div>
      <div class="grup">
        <label for="sandi">Kata sandi</label>
        <input id="sandi" class="isian" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="tombol-utama" id="btnMasuk">Masuk</button>
    </div>
  </div>
</div>

<!-- ================= APLIKASI ================= -->
<div id="app">
  <aside class="sisi">
    <div class="merek">buahmurah<span class="id">.id</span></div>
    <nav class="menu" id="menu"></nav>
    <div class="kartu-user">
      <div class="nm" id="userNama">—</div>
      <div class="rl" id="userRole">—</div>
      <button id="btnKeluar">Keluar</button>
    </div>
  </aside>
  <main>
    <div class="puncak">
      <div class="merek">buahmurah<span class="id">.id</span></div>
      <button id="btnKeluarHp">Keluar</button>
    </div>
    <div id="layar"></div>
  </main>
  <nav class="nav-bawah" id="navBawah"></nav>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================================
   1. KONFIGURASI — isi dua baris ini dari Supabase > Project Settings > API
   ===================================================================== */
const SUPABASE_URL = "https://xxxxxxxxxxxx.supabase.co";
const SUPABASE_ANON_KEY = "ganti-dengan-anon-public-key";

/* Penyimpanan sesi yang aman di lingkungan tanpa localStorage */
const memori = {};
const penyimpanan = {
  getItem:k=>{try{return localStorage.getItem(k)}catch(e){return memori[k]??null}},
  setItem:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){memori[k]=v}},
  removeItem:k=>{try{localStorage.removeItem(k)}catch(e){delete memori[k]}}
};
const terpasang = !SUPABASE_URL.includes("xxxxxxxxxxxx");
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth:{ storage:penyimpanan, persistSession:true, autoRefreshToken:true }
});

/* =====================================================================
   2. UTILITAS
   ===================================================================== */
const $ = s => document.querySelector(s);
const rp = n => "Rp " + new Intl.NumberFormat("id-ID").format(Math.round(Number(n)||0));
const angka = n => new Intl.NumberFormat("id-ID",{maximumFractionDigits:2}).format(Number(n)||0);
const tglIndo = d => d ? new Date(d+"T00:00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const hariIni = () => new Date().toLocaleDateString("sv-SE");
const bulanIni = () => hariIni().slice(0,7);
const aman = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let jamToast;
function toast(teks, jenis="sukses"){
  const t=$("#toast"); t.textContent=teks; t.className="tampil "+jenis;
  clearTimeout(jamToast); jamToast=setTimeout(()=>t.className="",2800);
}

let sesi=null, profil=null, halaman=null;

/* =====================================================================
   3. LOGIN
   ===================================================================== */
function pesanLogin(teks, jenis="salah"){
  const p=$("#pesanLogin");
  p.textContent=teks; p.className="pesan tampil "+jenis;
}
if(!terpasang){
  pesanLogin("Aplikasi belum tersambung. Buka index.html, isi SUPABASE_URL dan SUPABASE_ANON_KEY di bagian KONFIGURASI.","info");
}

async function masuk(){
  const email=$("#email").value.trim(), sandi=$("#sandi").value;
  if(!email||!sandi){ pesanLogin("Email dan kata sandi harus diisi."); return; }
  const b=$("#btnMasuk"); b.disabled=true; b.textContent="Memeriksa…";
  const { data, error } = await sb.auth.signInWithPassword({ email, password:sandi });
  b.disabled=false; b.textContent="Masuk";
  if(error){
    pesanLogin(error.message.includes("Invalid login")
      ? "Email atau kata sandi tidak cocok. Coba lagi."
      : "Gagal masuk: "+error.message);
    return;
  }
  await mulaiSesi(data.session);
}
$("#btnMasuk").addEventListener("click", masuk);
$("#sandi").addEventListener("keydown", e => { if(e.key==="Enter") masuk(); });
$("#email").addEventListener("keydown", e => { if(e.key==="Enter") $("#sandi").focus(); });

async function keluar(){
  await sb.auth.signOut();
  sesi=null; profil=null;
  $("#app").classList.remove("tampil");
  $("#login").style.display="grid";
  $("#sandi").value="";
  $("#pesanLogin").className="pesan";
}
$("#btnKeluar").addEventListener("click", keluar);
$("#btnKeluarHp").addEventListener("click", keluar);

async function mulaiSesi(s){
  sesi=s;
  const { data, error } = await sb.from("profiles").select("nama,role").eq("id", s.user.id).single();
  if(error||!data){
    pesanLogin("Profil pengguna belum dibuat. Jalankan supabase-setup.sql lalu buat ulang user."); 
    await sb.auth.signOut(); return;
  }
  profil = data;
  $("#login").style.display="none";
  $("#app").classList.add("tampil");
  $("#userNama").textContent = profil.nama || s.user.email;
  $("#userRole").textContent = profil.role==="manajemen" ? "Akun manajemen" : "Akun kasir";
  bangunMenu();
}

/* =====================================================================
   4. DAFTAR MENU
   ===================================================================== */
const MENU_KASIR = [
  {id:"penjualan",  label:"Penjualan",   ikon:"🍎"},
  {id:"pengeluaran",label:"Pengeluaran", ikon:"💸"},
  {id:"riwayat",    label:"Riwayat",     ikon:"🧾"}
];
const MENU_MANAJEMEN = [
  {id:"ringkasan",   label:"Ringkasan",     ikon:"📊"},
  {id:"cashflow",    label:"Cashflow",      ikon:"💰", pisah:"Pembukuan"},
  {id:"kulakan",     label:"Kulakan",       ikon:"🚚"},
  {id:"gaji",        label:"Gaji",          ikon:"👤"},
  {id:"stock_opname",label:"Stock Opname",  ikon:"📋", pisah:"Gudang"},
  {id:"stock_buah",  label:"Stock Buah",    ikon:"🍇"},
  {id:"penjualan_m", label:"Penjualan",     ikon:"🍎", pisah:"Data kasir"},
  {id:"pengeluaran_m",label:"Pengeluaran",  ikon:"💸"}
];
const menuAktif = () => profil.role==="manajemen" ? MENU_MANAJEMEN : MENU_KASIR;

function bangunMenu(){
  const daftar = menuAktif();
  $("#menu").innerHTML = daftar.map(m =>
    (m.pisah?`<div class="pisah">${m.pisah}</div>`:"") +
    `<button data-hal="${m.id}"><span class="ikon">${m.ikon}</span>${m.label}</button>`
  ).join("");
  $("#navBawah").innerHTML = daftar.map(m =>
    `<button data-hal="${m.id}"><span class="ikon">${m.ikon}</span>${m.label}</button>`
  ).join("");
  document.querySelectorAll("[data-hal]").forEach(b =>
    b.addEventListener("click", () => buka(b.dataset.hal)));
  buka(daftar[0].id);
}

function buka(id){
  halaman = id;
  document.querySelectorAll("[data-hal]").forEach(b =>
    b.classList.toggle("aktif", b.dataset.hal===id));
  $("#layar").innerHTML = `<div class="memuat">Memuat…</div>`;
  window.scrollTo({top:0});
  const peta = {
    penjualan:layarPenjualan, pengeluaran:layarPengeluaran, riwayat:layarRiwayat,
    ringkasan:layarRingkasan, cashflow:()=>layarBuku("cashflow"), kulakan:()=>layarBuku("kulakan"),
    gaji:layarGaji, stock_opname:layarOpname, stock_buah:layarStokBuah,
    penjualan_m:()=>layarDataKasir("penjualan"), pengeluaran_m:()=>layarDataKasir("pengeluaran")
  };
  (peta[id]||layarRingkasan)();
}

function judul(h,p){ return `<div class="judul"><div><h2>${h}</h2><p>${p}</p></div></div>`; }
function kosong(t,s){ return `<div class="kosong"><strong>${t}</strong>${s}</div>`; }

  const fBuah=$("#fBuah"), fQty=$("#fQty"), fHarga=$("#fHarga");
  const hitung = () => $("#fTotal").textContent = rp((+fQty.value||0)*(+fHarga.value||0));
  fBuah.addEventListener("change", () => {

  $("#qKurang").addEventListener("click",()=>{ fQty.value=Math.max(0,(+fQty.value||0)-0.5); hitung(); });

  document.querySelectorAll("[data-bayar]").forEach(b => b.addEventListener("click", () => {

async function muatStatHarian(){
  const t=hariIni();
  const [j,k] = await Promise.all([
    sb.from("penjualan").select("total").eq("tanggal",t),
    sb.from("pengeluaran").select("nominal").eq("tanggal",t)
  ]);
  const tot=(j.data||[]).reduce((a,b)=>a+Number(b.total||0),0);
  const kel=(k.data||[]).reduce((a,b)=>a+Number(b.nominal||0),0);
  if($("#sJual")) $("#sJual").textContent=rp(tot);
  if($("#sTrx")) $("#sTrx").textContent=(j.data||[]).length;
  if($("#sKeluar")) $("#sKeluar").textContent=rp(kel);
}

async function layarBuku(tabel){
  const nama = tabel==="cashflow" ? "Cashflow" : "Kulakan";
  const ket  = tabel==="cashflow"
    ? "Semua uang masuk dan keluar toko. Debit menambah saldo, kredit mengurangi."
    : "Belanja buah ke supplier. Debit untuk pengembalian, kredit untuk pembelian.";

  $("#layar").innerHTML = judul(nama, ket) + `
  <div class="papan">
    <div class="kepala-papan">
      <h3>Buku ${nama}</h3>
      <button class="tombol kuning" id="btnBuka">Tambah baris</button>
    </div>
    <div class="form-tambah" id="formTambah">
      <div class="kisi">
        <div><label>Nomor</label><input id="iNomor" class="isian num" type="number" min="1"></div>
        <div><label>Tanggal</label><input id="iTgl" class="isian" type="date" value="${hariIni()}"></div>
        <div style="grid-column:span 2"><label>Keterangan</label><input id="iKet" class="isian" placeholder="Setoran penjualan harian"></div>
        <div><label>Debit (masuk)</label><input id="iDebit" class="isian num" type="number" min="0" step="1000" value="0"></div>
        <div><label>Kredit (keluar)</label><input id="iKredit" class="isian num" type="number" min="0" step="1000" value="0"></div>
        <div><label>Bukti transaksi</label><input id="iBukti" class="isian" type="file" accept="image/*,application/pdf" style="padding:9px"></div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="tombol biru" id="btnSimpan">Simpan baris</button>
        <button class="tombol garis" id="btnBatal">Batal</button>
      </div>
    </div>
    <div class="gulung" id="isiTabel"><div class="memuat">Memuat…</div></div>
  </div>`;

  const form=$("#formTambah");
  $("#btnBuka").addEventListener("click", async () => {
    form.classList.toggle("buka");
    if(form.classList.contains("buka")){
      const { data } = await sb.from(tabel).select("nomor").order("nomor",{ascending:false}).limit(1);
      $("#iNomor").value = data&&data.length ? Number(data[0].nomor)+1 : 1;
      $("#iKet").focus();
    }
  });
  $("#btnBatal").addEventListener("click", () => form.classList.remove("buka"));

  $("#btnSimpan").addEventListener("click", async () => {
    const b=$("#btnSimpan"); b.disabled=true; b.textContent="Menyimpan…";
    let bukti=null;
    const berkas=$("#iBukti").files[0];
    if(berkas){
      const path=`${tabel}/${Date.now()}-${berkas.name.replace(/[^\w.\-]/g,"_")}`;
      const { error:eUp } = await sb.storage.from("bukti").upload(path, berkas);
      if(eUp){ b.disabled=false; b.textContent="Simpan baris"; return toast("Bukti gagal diunggah: "+eUp.message,"gagal"); }
      bukti = sb.storage.from("bukti").getPublicUrl(path).data.publicUrl;
    }
    const { error } = await sb.from(tabel).insert({
      nomor:+$("#iNomor").value||1, tanggal:$("#iTgl").value||hariIni(),
      keterangan:$("#iKet").value.trim(), debit:+$("#iDebit").value||0,
      kredit:+$("#iKredit").value||0, bukti_url:bukti
    });
    b.disabled=false; b.textContent="Simpan baris";
    if(error) return toast("Gagal menyimpan: "+error.message,"gagal");
    toast("Baris tersimpan");
    form.classList.remove("buka");
    ["iKet"].forEach(i=>$("#"+i).value=""); $("#iDebit").value=0; $("#iKredit").value=0; $("#iBukti").value="";
    muatBuku(tabel);
  });

  muatBuku(tabel);
}

async function muatBuku(tabel){
  const { data, error } = await sb.from(tabel).select("*").order("nomor",{ascending:true});
  const w=$("#isiTabel"); if(!w) return;
  if(error) { w.innerHTML=kosong("Tidak bisa memuat data",aman(error.message)); return; }
  if(!data||!data.length){ w.innerHTML=kosong("Buku masih kosong","Tekan “Tambah baris” untuk mencatat transaksi pertama."); return; }
  let saldo=0;
  const baris=data.map(r=>{
    saldo += Number(r.debit||0)-Number(r.kredit||0);
    return `<tr>
      <td class="num">${r.nomor}</td>
      <td>${tglIndo(r.tanggal)}</td>
      <td>${aman(r.keterangan)||"—"}</td>
      <td class="kanan">${Number(r.debit)?rp(r.debit):"—"}</td>
      <td class="kanan">${Number(r.kredit)?rp(r.kredit):"—"}</td>
      <td class="kanan saldo-sel">${rp(saldo)}</td>
      <td>${r.bukti_url?`<a href="${aman(r.bukti_url)}" target="_blank" rel="noopener">Lihat bukti</a>`:"—"}</td>
      <td><button class="hapus" data-id="${r.id}">Hapus</button></td>
    </tr>`;
  }).join("");
  w.innerHTML = `<table><thead><tr>
      <th>Nomor</th><th>Tanggal</th><th>Keterangan</th><th class="kanan">Debit</th>
      <th class="kanan">Kredit</th><th class="kanan">Saldo</th><th>Bukti Transaksi</th><th></th>
    </tr></thead><tbody>${baris}</tbody>
    <tfoot><tr><th colspan="5" class="kanan">Saldo akhir</th><th class="kanan num">${rp(saldo)}</th><th colspan="2"></th></tr></tfoot></table>`;
  pasangHapus(tabel, ()=>muatBuku(tabel));
}

function pasangHapus(tabel, muatUlang){
  document.querySelectorAll(".hapus").forEach(b => b.addEventListener("click", async () => {
    if(!confirm("Hapus baris ini? Tindakan tidak bisa dibatalkan.")) return;
    const { error } = await sb.from(tabel).delete().eq("id", b.dataset.id);
    if(error) return toast("Gagal menghapus: "+error.message,"gagal");
    toast("Baris dihapus"); muatUlang();
  }));
}

    const { error } = await sb.from("gaji").insert({
      nomor:+$("#gNomor").value||1, nama:$("#gNama").value.trim(), bulan:$("#gBulan").value||bulanIni(),
      absensi:+$("#gAbsen").value||0, total_hari:+$("#gHari").value||0,
      kasbon:+$("#gKasbon").value||0, total:+$("#gTotal").value||0
    });
    b.disabled=false; b.textContent="Simpan gaji";
    if(error) return toast("Gagal menyimpan: "+error.message,"gagal");
    toast("Data gaji tersimpan"); form.classList.remove("buka"); muatGaji();
  });

  muatGaji();
}

async function muatGaji(){
  const { data } = await sb.from("gaji").select("*").order("bulan",{ascending:false}).order("nomor");
  const w=$("#isiTabel"); if(!w) return;
  if(!data||!data.length){ w.innerHTML=kosong("Belum ada data gaji","Tambahkan rekap upah bulan berjalan."); return; }
  w.innerHTML = `<table><thead><tr>
      <th>Nomor</th><th>Nama</th><th>Bulan</th><th class="kanan">Absensi / Total Hari</th>
      <th class="kanan">Kasbon</th><th class="kanan">Total</th><th></th></tr></thead><tbody>` +
    data.map(r=>`<tr>
      <td class="num">${r.nomor}</td><td>${aman(r.nama)||"—"}</td>
      <td>${new Date(r.bulan+"-01T00:00:00").toLocaleDateString("id-ID",{month:"long",year:"numeric"})}</td>
      <td class="kanan">${r.absensi} / ${r.total_hari}</td>
      <td class="kanan">${rp(r.kasbon)}</td>
      <td class="kanan saldo-sel">${rp(r.total)}</td>
      <td><button class="hapus" data-id="${r.id}">Hapus</button></td></tr>`).join("") + `</tbody></table>`;
  pasangHapus("gaji", muatGaji);
}

/* =====================================================================
   11. MANAJEMEN — STOCK OPNAME
   ===================================================================== */
async function layarOpname(){
  $("#layar").innerHTML = judul("Stock Opname", "Hasil pengecekan fisik barang di gudang.") + `
  <div class="papan">
    <div class="kepala-papan"><h3>Catatan opname</h3>
      <button class="tombol kuning" id="btnBuka">Tambah catatan</button></div>
    <div class="form-tambah" id="formTambah">
      <div class="kisi">
        <div><label>Nomor</label><input id="oNomor" class="isian num" type="number" min="1"></div>
        <div><label>Tanggal</label><input id="oTgl" class="isian" type="date" value="${hariIni()}"></div>
        <div style="grid-column:span 2"><label>Keterangan</label><input id="oKet" class="isian" placeholder="Apel Fuji 3 Kg lembek"></div>
        <div><label>Kondisi</label>
          <select id="oKondisi" class="isian"><option>Baik</option><option>Rusak</option></select></div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="tombol biru" id="btnSimpan">Simpan catatan</button>
        <button class="tombol garis" id="btnBatal">Batal</button>
      </div>
    </div>
    <div class="gulung" id="isiTabel"><div class="memuat">Memuat…</div></div>
  </div>`;

  const form=$("#formTambah");
  $("#btnBuka").addEventListener("click", async () => {
    form.classList.toggle("buka");
    if(form.classList.contains("buka")){
      const { data } = await sb.from("stock_opname").select("nomor").order("nomor",{ascending:false}).limit(1);
      $("#oNomor").value = data&&data.length ? Number(data[0].nomor)+1 : 1;
      $("#oKet").focus();
    }
  });
  $("#btnBatal").addEventListener("click",()=>form.classList.remove("buka"));
  $("#btnSimpan").addEventListener("click", async () => {
    if(!$("#oKet").value.trim()) return toast("Keterangan belum diisi.","gagal");
    const b=$("#btnSimpan"); b.disabled=true; b.textContent="Menyimpan…";
    const { error } = await sb.from("stock_opname").insert({
      nomor:+$("#oNomor").value||1, tanggal:$("#oTgl").value||hariIni(),
      keterangan:$("#oKet").value.trim(), kondisi:$("#oKondisi").value });
    b.disabled=false; b.textContent="Simpan catatan";
    if(error) return toast("Gagal menyimpan: "+error.message,"gagal");
    toast("Catatan tersimpan"); form.classList.remove("buka"); $("#oKet").value=""; muatOpname();
  });
  muatOpname();
}

async function muatOpname(){
  const { data } = await sb.from("stock_opname").select("*").order("nomor",{ascending:true});
  const w=$("#isiTabel"); if(!w) return;
  if(!data||!data.length){ w.innerHTML=kosong("Belum ada opname","Catat hasil pengecekan gudang pertama."); return; }
  w.innerHTML = `<table><thead><tr>
      <th>Nomor</th><th>Tanggal</th><th>Keterangan</th><th>Kondisi</th><th></th></tr></thead><tbody>` +
    data.map(r=>`<tr>
      <td class="num">${r.nomor}</td><td>${tglIndo(r.tanggal)}</td><td>${aman(r.keterangan)}</td>
      <td><span class="lencana ${r.kondisi==="Baik"?"baik":"rusak"}">${r.kondisi}</span></td>
      <td><button class="hapus" data-id="${r.id}">Hapus</button></td></tr>`).join("") + `</tbody></table>`;
  pasangHapus("stock_opname", muatOpname);
}

/* =====================================================================
   12. MANAJEMEN — STOCK BUAH
   ===================================================================== */
async function layarStokBuah(){
  $("#layar").innerHTML = judul("Stock Buah", "Sisa barang per jenis buah. Ubah jumlahnya langsung di kolom.") + `
  <div class="papan">
    <div class="kepala-papan"><h3>Persediaan</h3>
      <button class="tombol kuning" id="btnBuka">Tambah jenis</button></div>
    <div class="form-tambah" id="formTambah">
      <div class="kisi">
        <div><label>Jenis buah</label><input id="bNama" class="isian" placeholder="Durian Montong"></div>
        <div><label>Jumlah</label><input id="bJumlah" class="isian num" type="number" min="0" step="0.5" value="0"></div>
        <div><label>Satuan</label>
          <select id="bSatuan" class="isian"><option>Kg</option><option>Pcs</option><option>Peti</option><option>Ikat</option></select></div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="tombol biru" id="btnSimpan">Simpan jenis</button>
        <button class="tombol garis" id="btnBatal">Batal</button>
      </div>
    </div>
    <div class="gulung" id="isiTabel"><div class="memuat">Memuat…</div></div>
  </div>`;

  const form=$("#formTambah");
  $("#btnBuka").addEventListener("click",()=>{ form.classList.toggle("buka"); if(form.classList.contains("buka")) $("#bNama").focus(); });
  $("#btnBatal").addEventListener("click",()=>form.classList.remove("buka"));
  $("#btnSimpan").addEventListener("click", async () => {
    if(!$("#bNama").value.trim()) return toast("Nama buah belum diisi.","gagal");
    const b=$("#btnSimpan"); b.disabled=true; b.textContent="Menyimpan…";
    const { error } = await sb.from("stock_buah").insert({
      jenis_buah:$("#bNama").value.trim(), jumlah:+$("#bJumlah").value||0, satuan:$("#bSatuan").value });
    b.disabled=false; b.textContent="Simpan jenis";
    if(error) return toast("Gagal menyimpan: "+error.message,"gagal");
    toast("Jenis buah ditambahkan"); form.classList.remove("buka"); $("#bNama").value=""; $("#bJumlah").value=0; muatStokBuah();
  });
  muatStokBuah();
}

async function muatStokBuah(){
  const { data } = await sb.from("stock_buah").select("*").order("jenis_buah");
  const w=$("#isiTabel"); if(!w) return;
  if(!data||!data.length){ w.innerHTML=kosong("Belum ada persediaan","Tambahkan jenis buah yang kamu jual."); return; }
  w.innerHTML = `<table><thead><tr>
      <th>Jenis Buah</th><th class="kanan">Jumlah</th><th>Satuan</th><th></th><th></th></tr></thead><tbody>` +
    data.map(r=>`<tr>
      <td>${aman(r.jenis_buah)}</td>
      <td class="kanan"><input class="isian num ubah-jumlah" data-id="${r.id}" type="number" step="0.5" min="0"
           value="${r.jumlah}" style="width:110px;padding:7px 10px;text-align:right"></td>
      <td>${aman(r.satuan)}</td>
      <td><button class="tombol garis simpan-jumlah" data-id="${r.id}" style="padding:6px 13px;font-size:13px">Simpan</button></td>
      <td><button class="hapus" data-id="${r.id}">Hapus</button></td></tr>`).join("") + `</tbody></table>`;

  document.querySelectorAll(".simpan-jumlah").forEach(b => b.addEventListener("click", async () => {
    const inp=document.querySelector(`.ubah-jumlah[data-id="${b.dataset.id}"]`);
    const { error } = await sb.from("stock_buah")
      .update({ jumlah:+inp.value||0, updated_at:new Date().toISOString() }).eq("id",b.dataset.id);
    toast(error ? "Gagal menyimpan: "+error.message : "Jumlah diperbarui", error?"gagal":"sukses");
  }));
  pasangHapus("stock_buah", muatStokBuah);
}

/* =====================================================================
   13. MANAJEMEN — LIHAT DATA KASIR
   ===================================================================== */
async function layarDataKasir(tabel){
  const jual = tabel==="penjualan";
  const { data } = await sb.from(tabel).select("*").order("tanggal",{ascending:false}).order("created_at",{ascending:false}).limit(300);
  const total=(data||[]).reduce((a,r)=>a+Number(jual?r.total:r.nominal||0),0);

  $("#layar").innerHTML = judul(jual?"Penjualan":"Pengeluaran",
      jual?"Seluruh transaksi yang dicatat kasir.":"Seluruh uang keluar dari laci kasir.") + `
  <div class="papan">
    <div class="kepala-papan"><h3>300 catatan terakhir</h3><span class="ket num">Total ${rp(total)}</span></div>
    <div class="gulung">${ (data&&data.length) ? (jual ? `
      <table><thead><tr><th>Tanggal</th><th>Buah</th><th class="kanan">Qty</th><th class="kanan">Harga</th><th class="kanan">Total</th><th>Bayar</th><th></th></tr></thead><tbody>` +
      data.map(r=>`<tr><td>${tglIndo(r.tanggal)}</td><td>${aman(r.jenis_buah)}</td>
        <td class="kanan">${angka(r.qty)} ${aman(r.satuan)}</td><td class="kanan">${rp(r.harga)}</td>
        <td class="kanan saldo-sel">${rp(r.total)}</td>
        <td>${r.pembayaran?`<span class="lencana ${r.pembayaran==="Cash"?"cash":"tf"}">${r.pembayaran}</span>`:"—"}</td>
        <td><button class="hapus" data-id="${r.id}">Hapus</button></td></tr>`).join("")+`</tbody></table>` : `
      <table><thead><tr><th>Tanggal</th><th>Keterangan</th><th class="kanan">Nominal</th><th></th></tr></thead><tbody>` +
      data.map(r=>`<tr><td>${tglIndo(r.tanggal)}</td><td>${aman(r.keterangan)}</td>
        <td class="kanan saldo-sel">${rp(r.nominal)}</td>
        <td><button class="hapus" data-id="${r.id}">Hapus</button></td></tr>`).join("")+`</tbody></table>`)
      : kosong("Belum ada data","Kasir belum menyimpan catatan apa pun.") }
    </div>
  </div>`;
  pasangHapus(tabel, ()=>layarDataKasir(tabel));
}

/* =====================================================================
   14. JALAN
   ===================================================================== */
(async () => {
  if(!terpasang) return;
  const { data } = await sb.auth.getSession();
  if(data.session) await mulaiSesi(data.session);
})();
</script>
